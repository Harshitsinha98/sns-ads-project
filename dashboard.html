<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal | SNS ADS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
        .hero-glow { background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.15), transparent 40%); }
    </style>
</head>
<body class="min-h-screen hero-glow flex flex-col">

    <nav class="w-full border-b border-white/5 bg-black/40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="h-8 w-1 bg-blue-600 rounded-full"></div>
                <div class="text-xl font-black tracking-tight text-white uppercase">SNS ADS Portal</div>
            </div>
            <div class="flex items-center gap-6">
                <span id="userDisplay" class="text-xs font-bold text-gray-400 uppercase tracking-widest hidden md:block"></span>
                <button onclick="logout()" class="text-xs font-bold text-red-500 hover:text-red-400 uppercase tracking-widest transition">Logout</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12">
        
        <div class="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-2">My Services</h1>
                <p class="text-gray-400 text-sm">Manage your active plans and track billing history.</p>
            </div>
            <a href="https://wa.me/917016163373" target="_blank" class="bg-blue-600/10 border border-blue-500/30 text-blue-400 hover:bg-blue-600 hover:text-white px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest transition flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884"/></svg>
                Contact Support
            </a>
        </div>

        <div id="loadingIndicator" class="text-gray-500 font-bold text-sm tracking-widest uppercase animate-pulse">
            Fetching your data...
        </div>

        <div id="ordersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

    </main>

    <script>
        window.onload = async () => {
            const email = localStorage.getItem('userEmail');
            const phone = localStorage.getItem('userPhone');

            // Security: Agar login data nahi hai toh redirect back to home
            if (!email && !phone) {
                window.location.href = "index.html";
                return;
            }

            // Display logged in user
            document.getElementById('userDisplay').innerText = `Logged in as: ${email || phone}`;

            try {
                // Backend API call
                let url = new URL('https://sns-ads-project.onrender.com/api/my-orders');
                if (email) url.searchParams.append('email', email);
                if (phone) url.searchParams.append('phone', phone);

                const res = await fetch(url);
                const orders = await res.json();

                document.getElementById('loadingIndicator').style.display = 'none';
                const ordersDiv = document.getElementById('ordersList');

                // Agar koi order nahi mila
                if (!orders || orders.length === 0) {
                    ordersDiv.innerHTML = `
                        <div class="col-span-full glass-panel rounded-[2rem] p-12 text-center border-dashed border-white/20">
                            <h3 class="text-xl font-bold text-gray-300 mb-4">No active plans found.</h3>
                            <p class="text-gray-500 text-sm mb-6">Looks like you haven't started any campaigns with us yet.</p>
                            <a href="index.html#pricing" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold text-xs uppercase tracking-widest transition shadow-lg shadow-blue-600/20">View Services</a>
                        </div>`;
                    return;
                }

                // Agar orders hain, toh loop chalakar cards banao
                let html = "";
                orders.forEach(o => {
                    const statusColor = o.paymentStatus === 'Paid' ? 'text-green-400 bg-green-400/10 border-green-500/20' : 'text-yellow-400 bg-yellow-400/10 border-yellow-500/20';
                    const formattedDate = new Date(o.date).toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });

                    html += `
                        <div class="glass-panel p-8 rounded-3xl hover:border-blue-500/30 transition-colors relative group">
                            <div class="absolute top-6 right-6 ${statusColor} border px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">${o.paymentStatus}</div>
                            
                            <h3 class="text-xl font-bold text-white mb-2 pr-20">${o.service.split(' (')[0]}</h3>
                            <p class="text-xs text-gray-500 uppercase tracking-widest font-bold mb-6">${formattedDate}</p>
                            
                            <div class="space-y-3 border-t border-white/5 pt-6 mt-6">
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-gray-400">Total Billed</span>
                                    <span class="font-bold text-white">₹${o.amount}</span>
                                </div>
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-gray-400">Order ID</span>
                                    <span class="font-mono text-xs text-gray-500 truncate max-w-[120px]" title="${o.orderId || 'N/A'}">${o.orderId ? o.orderId.substring(0,10)+'...' : 'N/A'}</span>
                                </div>
                            </div>
                        </div>`;
                });
                
                ordersDiv.innerHTML = html;

            } catch (e) {
                document.getElementById('loadingIndicator').innerText = "Failed to load data. Please try again.";
                console.error(e);
            }
        };

        // Logout logic
        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userPhone');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
