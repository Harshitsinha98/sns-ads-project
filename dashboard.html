<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | SNS ADS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hero-gradient {
            background: radial-gradient(circle at top right, #1e3a8a, #0f172a, #000000);
        }
    </style>
</head>
<body class="hero-gradient text-white min-h-screen">

    <!-- Navbar -->
    <nav class="p-6 border-b border-white/5 bg-black/20 backdrop-blur-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="text-2xl font-black tracking-tighter text-blue-500">SNS ADS</div>
            <button onclick="logout()" class="text-xs font-bold text-gray-400 uppercase tracking-widest hover:text-red-400 transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto py-20 px-6">
        <div class="mb-12">
            <h1 class="text-5xl font-extrabold mb-2">Welcome Back, <span id="userName" class="text-blue-500">...</span></h1>
            <p class="text-gray-400">Manage your growth strategy and active subscriptions.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="glass-card p-8 rounded-3xl">
                <p class="text-gray-500 text-xs uppercase font-bold tracking-widest mb-2">Active Plans</p>
                <h3 id="activeCount" class="text-3xl font-bold">0</h3>
            </div>
            <div class="glass-card p-8 rounded-3xl">
                <p class="text-gray-500 text-xs uppercase font-bold tracking-widest mb-2">Total Spent</p>
                <h3 id="totalSpent" class="text-3xl font-bold">₹0</h3>
            </div>
            <div class="glass-card p-8 rounded-3xl">
                <p class="text-gray-500 text-xs uppercase font-bold tracking-widest mb-2">Account Status</p>
                <h3 class="text-3xl font-bold text-green-500">Verified</h3>
            </div>
        </div>

        <div class="glass-card rounded-[2.5rem] p-10">
            <h2 class="text-xl font-bold mb-8 flex items-center gap-3">
                <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
                Your Subscriptions
            </h2>
            <div id="ordersList" class="space-y-4">
                <p class="text-gray-500 italic">Fetching your data from the cloud...</p>
            </div>
        </div>
        <div class="glass-card p-8 rounded-3xl mt-8">
    <h3 class="text-xl font-bold mb-4">Live Campaign Progress</h3>
    <div class="w-full bg-white/5 rounded-full h-4 mb-4">
        <div id="progressBar" class="bg-blue-600 h-4 rounded-full transition-all duration-1000" style="width: 0%"></div>
    </div>
    <p id="statusUpdate" class="text-gray-400 text-sm font-medium italic">"No active updates from admin yet."</p>
</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7W5HWVe1JYbqhpGdrguNrQOgU3DwW_44",
            authDomain: "sns-ads.firebaseapp.com",
            projectId: "sns-ads",
            storageBucket: "sns-ads.firebasestorage.app",
            messagingSenderId: "193364476047",
            appId: "1:193364476047:web:d65e2412d13a42f701f0fa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
    if (user) {
        const docRef = doc(db, "customers", user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            const data = docSnap.data();
            // Admin updates handle karein
            document.getElementById('progressBar').style.width = data.progress || "10%";
            document.getElementById('statusUpdate').innerText = data.manualUpdate || "Hum aapke creatives par kaam kar rahe hain!";
        }
    }
});

        function renderOrders(orders) {
            const list = document.getElementById('ordersList');
            const activeCount = document.getElementById('activeCount');
            const totalSpent = document.getElementById('totalSpent');
            
            if (orders.length === 0) {
                list.innerHTML = `<p class="text-gray-500">Aapka koi active plan nahi hai.</p>`;
                return;
            }

            list.innerHTML = "";
            let spent = 0;
            orders.forEach(order => {
                spent += order.amount;
                list.innerHTML += `
                    <div class="flex flex-col md:flex-row justify-between items-center p-6 bg-white/5 border border-white/5 rounded-2xl">
                        <div>
                            <h4 class="font-bold text-lg text-blue-400">${order.plan}</h4>
                            <p class="text-xs text-gray-500">OrderID: ${order.orderId}</p>
                        </div>
                        <div class="text-right mt-4 md:mt-0">
                            <span class="bg-blue-500/20 text-blue-400 px-4 py-1 rounded-full text-[10px] font-bold uppercase tracking-tighter">${order.status}</span>
                            <p class="mt-2 font-black">₹${order.amount}</p>
                        </div>
                    </div>
                `;
            });
            activeCount.innerText = orders.length;
            totalSpent.innerText = "₹" + spent.toLocaleString();
        }

        window.logout = () => {
            signOut(auth).then(() => window.location.href = "index.html");
        };
    </script>
</body>
</html>
