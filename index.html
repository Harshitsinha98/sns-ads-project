<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS ADS - Premium Marketing Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Hero Section -->
    <header class="bg-blue-900 text-white py-16 px-6 text-center">
        <h1 class="text-4xl md:text-6xl font-bold mb-4">Scale Your Business with SNS ADS</h1>
        <p class="text-xl text-blue-100 mb-8">Professional Meta & Google Ads Management for Serious Growth.</p>
    </header>

    <!-- Pricing Section (Wapas Add Kar Diya) -->
    <section class="py-20 px-6 bg-white" id="pricing">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-3xl font-bold mb-12 text-gray-800">Our Growth Plans</h2>
            <div class="border-2 border-blue-600 rounded-2xl p-8 shadow-xl bg-blue-50 relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-blue-600 text-white px-4 py-1 text-sm font-bold rounded-bl-lg uppercase">Best Value</div>
                <h3 class="text-2xl font-bold text-blue-900 mb-4">Premium Ads Setup</h3>
                <div class="text-5xl font-extrabold mb-6 text-gray-900">₹14,999 <span class="text-lg text-gray-500 font-normal">/month</span></div>
                
                <ul class="text-left space-y-4 mb-8 text-gray-700">
                    <li class="flex items-center">✅ Meta & Instagram Ads Setup</li>
                    <li class="flex items-center">✅ Custom Audience Research</li>
                    <li class="flex items-center">✅ Weekly Performance Reports</li>
                    <li class="flex items-center">✅ Dedicated Campaign Manager</li>
                </ul>

                <!-- Form for Customer Details -->
                <div class="space-y-4 mb-6">
                    <input type="text" id="name" placeholder="Enter Your Name" class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                    <input type="email" id="email" placeholder="Enter Your Email" class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                </div>

                <button onclick="payNow()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-lg hover:bg-blue-700 transition duration-300 text-lg shadow-lg">
                    🚀 Start My Growth Now
                </button>
            </div>
        </div>
    </section>

    <script>
        async function payNow() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            if(!name || !email) {
                alert("Bhai, please Name aur Email sahi se bhar do!");
                return;
            }

            // Step 1: Backend se Order ID lo
            const res = await fetch('https://sns-ads-project.onrender.com/api/create-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: 14999 }) // ₹14,999
            });
            const order = await res.json();

            // Step 2: Razorpay Options
            const options = {
                "key": "rzp_test_YOUR_KEY_HERE", // Ye hum Render ke env se handle kar rahe hain
                "amount": order.amount,
                "currency": "INR",
                "name": "SNS ADS Agency",
                "description": "Premium Ads Management Plan",
                "order_id": order.id,
                
                // --- 2nd Point: Payment Success Logic ---
                "handler": function (response) {
                    fetch('https://sns-ads-project.onrender.com/api/payment-success', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: name,
                            email: email,
                            service: "Premium Ads Setup",
                            amount: 1499900,
                            paymentId: response.razorpay_payment_id,
                            orderId: response.razorpay_order_id
                        })
                    })
                    .then(() => {
                        alert("Mubarak ho! Payment successful aur aapka data Admin Dashboard mein save ho gaya hai.");
                        window.location.reload();
                    })
                    .catch(err => console.error("Data save error:", err));
                },
                "prefill": {
                    "name": name,
                    "email": email
                },
                "theme": { "color": "#1e3a8a" }
            };

            const rzp = new Razorpay(options);
            rzp.open();
        }
    </script>

</body>
</html>
