<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SNS ADS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-blue-900">SNS ADS - Master Dashboard</h1>
            <button onclick="loadData()" class="bg-blue-600 text-white px-4 py-2 rounded">Refresh</button>
        </div>
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="p-4">Customer</th>
                        <th class="p-4">Service</th>
                        <th class="p-4">Status</th>
                        <th class="p-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="leadsTable"></tbody>
            </table>
        </div>
    </div>
    <script>
        async function loadData() {
            const res = await fetch('https://sns-ads-project.onrender.com/api/admin/leads');
            const data = await res.json();
            document.getElementById('leadsTable').innerHTML = data.map(item => `
                <tr class="border-b">
                    <td class="p-4"><b>${item.name}</b><br><span class="text-sm text-gray-500">${item.email}</span></td>
                    <td class="p-4">${item.service}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded text-xs font-bold ${item.paymentStatus === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                            ${item.paymentStatus}
                        </span>
                    </td>
                    <td class="p-4">
                        <button onclick="updateStatus('${item._id}', 'In Progress')" class="bg-yellow-500 text-white text-xs px-2 py-1 rounded">Start</button>
                        <button onclick="updateStatus('${item._id}', 'Completed')" class="bg-green-600 text-white text-xs px-2 py-1 rounded">Finish</button>
                    </td>
                </tr>
            `).join('');
        }
        async function updateStatus(id, status) {
            await fetch('https://sns-ads-project.onrender.com/api/admin/update-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status })
            });
            loadData();
        }
        loadData();
    </script>
</body>
</html>
