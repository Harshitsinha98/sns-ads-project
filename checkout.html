<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Checkout | SNS ADS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { background: radial-gradient(circle at top right, #1e3a8a, #020617, #000000); color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-style { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; padding: 14px; border-radius: 12px; color: white; outline: none; }
        .input-style:focus { border-color: #3b82f6; }
        .input-style:disabled, .input-style[readonly] { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-card max-w-lg w-full rounded-[2rem] p-8 shadow-2xl relative">
        <a href="index.html" class="absolute top-6 right-6 text-gray-400 hover:text-white text-3xl leading-none">&times;</a>
        
        <h2 class="text-3xl font-bold mb-6 text-blue-400">Complete Your Order</h2>
        
        <div id="checkoutForm" class="space-y-5">
            <input type="text" id="custName" placeholder="Full Name" class="input-style">
            
            <div>
                <div class="flex gap-2">
                    <input type="email" id="custEmail" placeholder="Business Email" class="input-style">
                    <button id="emailBtn" onclick="window.handleEmail()" class="bg-blue-600 px-5 rounded-xl font-bold hover:bg-blue-500 whitespace-nowrap transition">Verify</button>
                </div>
                <div id="emailOtpGroup" class="hidden mt-2 flex gap-2">
                    <input type="text" id="emailOtp" placeholder="Enter Email OTP" class="input-style">
                    <button onclick="window.verifyEmailOTP()" class="bg-green-600 px-5 rounded-xl font-bold transition">Confirm</button>
                </div>
            </div>

            <div>
                <div class="flex gap-2">
                    <input type="tel" id="custPhone" placeholder="Mobile Number" class="input-style">
                    <button id="phoneBtn" onclick="window.handlePhone()" class="bg-blue-600 px-5 rounded-xl font-bold hover:bg-blue-500 whitespace-nowrap transition">Verify</button>
                </div>
                
                <div id="recaptcha-container" class="my-2"></div>

                <div id="phoneOtpGroup" class="hidden mt-2 flex gap-2">
                    <input type="text" id="phoneOtp" placeholder="Enter Phone OTP" class="input-style">
                    <button onclick="window.verifyPhoneOTP()" class="bg-green-600 px-5 rounded-xl font-bold transition">Confirm</button>
                </div>
            </div>

            <div class="flex gap-4">
                <select id="custState" class="input-style flex-1 bg-[#0f172a]">
                    <option value="" disabled selected>Select State</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Maharashtra">Maharashtra</option>
                </select>
                <input type="text" id="custCity" placeholder="City" class="input-style flex-1">
            </div>
            
            <textarea id="custAddress" placeholder="Full Address (Optional)" class="input-style h-20 resize-none"></textarea>

            <div class="p-5 bg-blue-900/20 rounded-xl border border-blue-500/30">
                <p class="text-sm text-gray-300">Selected Service:</p>
                <p id="planDisplay" class="text-xl font-bold text-white mb-2">Loading...</p>
                <div class="w-full h-px bg-white/10 my-2"></div>
                <div class="flex justify-between items-center mt-2">
                    <span class="text-lg">Total Amount:</span>
                    <span class="text-2xl font-black text-green-400">₹<span id="totalAmt">0</span></span>
                </div>
            </div>

            <button id="payBtn" disabled onclick="window.startPayment()" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-lg uppercase tracking-wider transition disabled:opacity-30 disabled:bg-gray-600">
                Pay Now
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyB7W5HWVe1JYbqhpGdrguNrQOgU3DwW_44", 
            authDomain: "sns-ads.firebaseapp.com", 
            projectId: "sns-ads", 
            storageBucket: "sns-ads.firebasestorage.app", 
            messagingSenderId: "193364476047", 
            appId: "1:193364476047:web:d65e2412d13a42f701f0fa" 
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.emailVerified = false;
        window.phoneVerified = false;
        window.finalAmount = 0;
        window.selectedPlan = "";

        // 1. URL parsing & Form Initialization
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            window.selectedPlan = params.get('plan') || "Custom Service";
            window.finalAmount = params.get('amount') || "0";
            
            document.getElementById('planDisplay').innerText = window.selectedPlan;
            document.getElementById('totalAmt').innerText = window.finalAmount;

            const savedEmail = localStorage.getItem('userEmail');
            const savedPhone = localStorage.getItem('userPhone');
            
            if(savedEmail) {
                document.getElementById('custEmail').value = savedEmail;
                document.getElementById('custEmail').readOnly = true;
                document.getElementById('emailBtn').innerText = "Verified ✅";
                document.getElementById('emailBtn').disabled = true;
                document.getElementById('emailOtpGroup').classList.add('hidden');
                window.emailVerified = true;
            }
            if(savedPhone) {
                document.getElementById('custPhone').value = savedPhone;
                document.getElementById('custPhone').readOnly = true;
                document.getElementById('phoneBtn').innerText = "Verified ✅";
                document.getElementById('phoneBtn').disabled = true;
                document.getElementById('phoneOtpGroup').classList.add('hidden');
                window.phoneVerified = true;
            }
            window.checkReady();
        };

        window.checkReady = function() {
            if(window.emailVerified && window.phoneVerified) {
                document.getElementById('payBtn').disabled = false;
            }
        };

        // 2. Email OTP Logic (Backend se chalega)
        window.handleEmail = async function() {
            const email = document.getElementById('custEmail').value;
            if(!email) return alert("Enter email first");
            await fetch('https://sns-ads-project.onrender.com/api/send-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email }) });
            document.getElementById('emailOtpGroup').classList.remove('hidden');
        };

        window.verifyEmailOTP = async function() {
            const email = document.getElementById('custEmail').value;
            const otp = document.getElementById('emailOtp').value;
            const res = await fetch('https://sns-ads-project.onrender.com/api/verify-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, otp }) });
            
            if(res.ok) {
                window.emailVerified = true;
                localStorage.setItem('userEmail', email); 
                document.getElementById('emailOtpGroup').classList.add('hidden');
                document.getElementById('custEmail').readOnly = true;
                document.getElementById('emailBtn').innerText = "Verified ✅";
                document.getElementById('emailBtn').disabled = true;
                window.checkReady();
            } else alert("Invalid Email OTP");
        };

        // 3. Phone OTP Logic (Ab Firebase se chalega)
        window.handlePhone = async function() {
            const phoneInput = document.getElementById('custPhone').value.trim();
            if(!phoneInput) return alert("Enter phone first");

            const phoneNumber = phoneInput.startsWith('+') ? phoneInput : '+91' + phoneInput;
            const btn = document.getElementById('phoneBtn');
            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                if(!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                        'size': 'invisible'
                    });
                }
                window.confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier);
                document.getElementById('phoneOtpGroup').classList.remove('hidden');
            } catch (error) {
                alert("SMS Error: " + error.message);
                btn.innerText = "Verify";
                btn.disabled = false;
            }
        };

        window.verifyPhoneOTP = async function() {
            const code = document.getElementById('phoneOtp').value.trim();
            if(!code) return alert("Enter SMS Code");

            try {
                await window.confirmationResult.confirm(code);
                window.phoneVerified = true;
                localStorage.setItem('userPhone', document.getElementById('custPhone').value);
                document.getElementById('phoneOtpGroup').classList.add('hidden');
                document.getElementById('custPhone').readOnly = true;
                document.getElementById('phoneBtn').innerText = "Verified ✅";
                document.getElementById('phoneBtn').disabled = true;
                window.checkReady();
            } catch (error) {
                alert("Invalid SMS OTP");
            }
        };

        // 4. Payment Logic
        window.startPayment = async function() {
            const name = document.getElementById('custName').value;
            const email = document.getElementById('custEmail').value;
            const phone = document.getElementById('custPhone').value;
            const state = document.getElementById('custState').value;
            const city = document.getElementById('custCity').value;

            if(!name || !state || !city) return alert("Please fill Name, State and City!");

            try {
                const payBtn = document.getElementById('payBtn');
                payBtn.innerText = "Processing...";
                payBtn.disabled = true;

                const res = await fetch('https://sns-ads-project.onrender.com/api/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: window.finalAmount }) 
                });
                const order = await res.json();

                const options = {
                    "key": "rzp_test_SkanzCNHx8h7vh", 
                    "amount": order.amount,
                    "currency": "INR",
                    "name": "SNS ADS",
                    "description": window.selectedPlan,
                    "order_id": order.id,
                    "handler": async function (response) {
                        await fetch('https://sns-ads-project.onrender.com/api/payment-success', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name, email, 
                                service: `${window.selectedPlan} (State: ${state}, City: ${city})`,
                                amount: window.finalAmount * 100, 
                                paymentId: response.razorpay_payment_id, 
                                orderId: response.razorpay_order_id
                            })
                        });
                        alert("Payment Success! Welcome to SNS ADS."); 
                        window.location.href = "index.html"; 
                    },
                    "prefill": { "name": name, "email": email, "contact": phone },
                    "theme": { "color": "#2563eb" },
                    "modal": {
                        "ondismiss": function() {
                            payBtn.innerText = "Pay Now";
                            payBtn.disabled = false;
                        }
                    }
                };
                new Razorpay(options).open();
            } catch (err) { 
                alert("Server Error! Please try again."); 
                document.getElementById('payBtn').innerText = "Pay Now";
                document.getElementById('payBtn').disabled = false;
            }
        };
    </script>
</body>
</html>
