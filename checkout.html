<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout | SNS ADS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-style { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; padding: 12px; border-radius: 12px; color: white; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#020617]">

    <div class="glass-card max-w-md w-full rounded-3xl p-8 shadow-2xl relative">
        <!-- Close Button -->
        <a href="index.html" class="absolute top-6 right-6 text-gray-400 hover:text-white text-2xl">×</a>
        
        <h2 class="text-2xl font-bold mb-6 text-blue-400">Checkout</h2>
        
        <div id="checkoutForm" class="space-y-4">
            <input type="text" id="custName" placeholder="Full Name" class="input-style">
            
            <!-- Email With Verification -->
            <div>
                <div class="flex gap-2">
                    <input type="email" id="custEmail" placeholder="Business Email" class="input-style">
                    <button id="emailBtn" onclick="handleEmail()" class="bg-blue-600 px-4 rounded-xl text-xs font-bold whitespace-nowrap">Verify</button>
                </div>
                <div id="emailOtpGroup" class="hidden mt-2 flex gap-2">
                    <input type="text" id="emailOtp" placeholder="Enter OTP" class="input-style">
                    <button onclick="verifyEmailOTP()" class="bg-green-600 px-4 rounded-xl text-xs font-bold">Confirm</button>
                    <button onclick="handleEmail()" class="bg-gray-700 px-2 rounded-xl text-[10px]">Resend</button>
                </div>
            </div>

            <!-- Phone With Verification -->
            <div>
                <div class="flex gap-2">
                    <input type="tel" id="custPhone" placeholder="Mobile Number" class="input-style">
                    <button id="phoneBtn" onclick="handlePhone()" class="bg-blue-600 px-4 rounded-xl text-xs font-bold whitespace-nowrap">Verify</button>
                </div>
                <div id="phoneOtpGroup" class="hidden mt-2 flex gap-2">
                    <input type="text" id="phoneOtp" placeholder="Enter OTP" class="input-style">
                    <button onclick="verifyPhoneOTP()" class="bg-green-600 px-4 rounded-xl text-xs font-bold">Confirm</button>
                    <button onclick="handlePhone()" class="bg-gray-700 px-2 rounded-xl text-[10px]">Resend</button>
                </div>
            </div>

            <div class="p-4 bg-white/5 rounded-xl border border-white/5">
                <p class="text-sm text-gray-400">Service: <span id="planDisplay" class="text-white"></span></p>
                <p class="text-xl font-bold mt-1">Total: <span id="totalAmt"></span></p>
            </div>

            <button id="payBtn" disabled onclick="startPayment()" class="w-full bg-blue-600 py-4 rounded-xl font-bold disabled:opacity-30 disabled:bg-gray-500">
                Pay Now
            </button>
        </div>
    </div>

    <script>
        // State Management
        let emailVerified = false, phoneVerified = false;

        async function handleEmail() {
            const email = document.getElementById('custEmail').value;
            await fetch('https://sns-ads-project.onrender.com/api/send-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email }) });
            document.getElementById('emailOtpGroup').classList.remove('hidden');
        }

        async function verifyEmailOTP() {
            const otp = document.getElementById('emailOtp').value;
            const res = await fetch('https://sns-ads-project.onrender.com/api/verify-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email: document.getElementById('custEmail').value, otp }) });
            if(res.ok) {
                emailVerified = true;
                document.getElementById('emailOtpGroup').classList.add('hidden');
                document.getElementById('emailBtn').innerText = "Verified ✅";
                document.getElementById('emailBtn').disabled = true;
                checkReady();
            } else alert("Invalid OTP");
        }

        async function handlePhone() {
            const phone = document.getElementById('custPhone').value;
            await fetch('https://sns-ads-project.onrender.com/api/send-phone-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ phone }) });
            document.getElementById('phoneOtpGroup').classList.remove('hidden');
        }

        async function verifyPhoneOTP() {
            const otp = document.getElementById('phoneOtp').value;
            const res = await fetch('https://sns-ads-project.onrender.com/api/verify-phone-otp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ phone: document.getElementById('custPhone').value, otp }) });
            if(res.ok) {
                phoneVerified = true;
                document.getElementById('phoneOtpGroup').classList.add('hidden');
                document.getElementById('phoneBtn').innerText = "Verified ✅";
                document.getElementById('phoneBtn').disabled = true;
                checkReady();
            } else alert("Invalid OTP");
        }

        function checkReady() {
            if(emailVerified && phoneVerified) document.getElementById('payBtn').disabled = false;
        }

        // URL Data setup logic... (Same as before)
    </script>
</body>
</html>
